<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KB Search · 线框 Wireframe</title>
<style>
  :root{
    --bg:oklch(96.5% 0.004 250);
    --surface:oklch(99.5% 0.002 250);
    --fg:oklch(24% 0.012 250);
    --muted:oklch(54% 0.012 250);
    --faint:oklch(68% 0.008 250);
    --border:oklch(88% 0.006 250);
    --block:oklch(91.5% 0.005 250);
    --accent:oklch(58% 0.10 195);
    --accent-ink:oklch(42% 0.09 200);
    --accent-wash:oklch(95% 0.025 195);
    --mono:ui-monospace,'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace;
    --sans:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
    --r:4px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg);color:var(--fg);font-family:var(--sans);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .label{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  button{font-family:inherit;cursor:pointer}

  /* ---- app shell ---- */
  .topbar{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface);
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .glyph{width:26px;height:26px;border:1.5px solid var(--fg);border-radius:3px;display:grid;place-items:center;flex:none}
  .glyph::after{content:"";width:9px;height:9px;background:var(--accent)}
  .brand b{font-weight:650;letter-spacing:-.01em}
  .brand .label{margin-left:2px}
  .wftag{margin-left:auto;border:1px dashed var(--accent-ink);color:var(--accent-ink);
    padding:3px 9px;border-radius:99px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em}
  .kbstat{display:flex;gap:16px;flex-wrap:wrap}
  .kbstat div{display:flex;flex-direction:column;gap:2px}
  .kbstat .v{font-family:var(--mono);font-size:13px;color:var(--muted)}

  .layout{display:grid;grid-template-columns:340px 1fr;gap:0;min-height:calc(100vh - 53px)}
  @media (max-width:1024px){.layout{grid-template-columns:300px 1fr}}
  @media (max-width:768px){.layout{grid-template-columns:1fr}}

  /* ---- left: query builder ---- */
  .panel{border-right:1px solid var(--border);background:var(--surface);padding:20px 18px;
    position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
  @media (max-width:768px){.panel{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--border)}}
  .panel h2{font-size:13px;margin:0 0 14px;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
  .panel h2 .n{font-family:var(--mono);color:var(--accent-ink);font-size:12px}
  .field{margin-bottom:20px}
  .field>.label{display:block;margin-bottom:7px}

  .kwrow{display:flex;gap:8px}
  .kwrow input{flex:1;min-width:0;border:1px solid var(--border);border-radius:var(--r);
    padding:9px 11px;font-size:14px;font-family:var(--sans);background:var(--surface);color:var(--fg)}
  .kwrow input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .addbtn{flex:none;border:1px solid var(--fg);background:var(--fg);color:var(--surface);
    border-radius:var(--r);padding:0 14px;font-size:18px;line-height:1}
  .hint{margin-top:7px;color:var(--faint);font-size:12px}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;min-height:30px}
  .chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);
    background:var(--bg);border-radius:99px;padding:5px 6px 5px 12px;font-size:13px}
  .chip .x{border:0;background:var(--block);color:var(--muted);border-radius:99px;
    width:18px;height:18px;display:grid;place-items:center;font-size:13px;line-height:1;padding:0}
  .chip .x:hover{background:var(--accent);color:#fff}
  .chips .empty{color:var(--faint);font-size:13px;font-style:italic}

  .modes{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
  .modes button{border:0;border-right:1px solid var(--border);background:var(--surface);
    padding:9px 4px;font-size:13px;color:var(--muted)}
  .modes button:last-child{border-right:0}
  .modes button.on{background:var(--accent-wash);color:var(--accent-ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
  .modedesc{margin-top:7px;color:var(--faint);font-size:12px;min-height:16px}

  .stepper{display:flex;align-items:center;gap:0;border:1px solid var(--border);border-radius:var(--r);width:fit-content}
  .stepper button{border:0;background:var(--surface);width:38px;height:38px;font-size:18px;color:var(--fg)}
  .stepper button:hover{background:var(--block)}
  .stepper .num{width:54px;text-align:center;font-family:var(--mono);font-size:15px;border-left:1px solid var(--border);border-right:1px solid var(--border);line-height:38px}

  .runbtn{width:100%;border:1px solid var(--accent-ink);background:var(--accent);color:#fff;
    border-radius:var(--r);padding:12px;font-size:15px;font-weight:600;letter-spacing:.01em}
  .runbtn:hover{background:var(--accent-ink)}
  .runbtn:disabled{opacity:.45;cursor:not-allowed}

  .maps{margin-top:18px;padding-top:16px;border-top:1px dashed var(--border);color:var(--faint);font-size:12px;overflow-wrap:anywhere}
  .maps code{font-family:var(--mono);color:var(--muted);font-size:11.5px;overflow-wrap:anywhere}

  /* ---- right: results ---- */
  .results{padding:20px 22px;min-width:0}
  .rhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .rhead .count{font-size:18px;font-weight:650}
  .rhead .sub{color:var(--faint);font-size:13px}
  .rsort{margin-left:auto;color:var(--muted);font-size:12.5px}

  .empty-state{border:1.5px dashed var(--border);border-radius:6px;padding:48px 24px;text-align:center;color:var(--faint)}
  .empty-state .big{font-size:15px;color:var(--muted);margin-bottom:6px}

  .card{border:1px solid var(--border);border-radius:6px;background:var(--surface);
    padding:16px 18px;margin-bottom:12px;display:grid;grid-template-columns:auto 1fr auto;
    gap:14px;align-items:start;cursor:pointer;transition:border-color .12s}
  .card:hover{border-color:var(--accent)}
  .rank{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent-ink);
    background:var(--accent-wash);border-radius:var(--r);padding:6px 9px;min-width:34px;text-align:center}
  .cmain{min-width:0}
  .ctitle{font-size:16px;font-weight:600;letter-spacing:-.01em;margin:0 0 6px;line-height:1.35}
  .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:10px}
  .meta span{display:inline-flex;gap:5px;align-items:baseline;font-size:12px;color:var(--muted)}
  .meta span i{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-style:normal}
  .pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;border:1px solid var(--border);
    border-radius:3px;padding:2px 7px;color:var(--muted)}
  .snip{color:var(--muted);font-size:13.5px;line-height:1.55}
  .snip .bars{display:grid;gap:6px}
  .bar{height:9px;background:var(--block);border-radius:3px}
  .path{margin-top:10px;font-family:var(--mono);font-size:11.5px;color:var(--faint);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cside{display:flex;flex-direction:column;align-items:end;gap:10px;text-align:right}
  .score{font-family:var(--mono);font-size:18px;font-weight:600;line-height:1}
  .score small{display:block;font-size:9.5px;font-weight:400;letter-spacing:.06em;color:var(--faint);text-transform:uppercase;margin-top:3px}
  .open{border:1px solid var(--fg);background:var(--surface);color:var(--fg);border-radius:var(--r);
    padding:7px 12px;font-size:12.5px;white-space:nowrap}
  .open:hover{background:var(--fg);color:var(--surface)}
  .opens{display:flex;flex-direction:column;gap:6px;align-items:stretch}
  .open.alt{border-color:var(--border);color:var(--muted)}
  .open.alt:hover{background:var(--muted);color:var(--surface);border-color:var(--muted)}
  .loading{border:1.5px dashed var(--border);border-radius:6px;padding:48px 24px;text-align:center;color:var(--accent-ink);font-family:var(--mono);font-size:13px;letter-spacing:.06em}

  @media (max-width:560px){
    .card{grid-template-columns:auto 1fr;gap:10px}
    .cside{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;
      border-top:1px solid var(--border);padding-top:10px;text-align:left}
    .opens{flex-direction:row;flex-wrap:wrap}
    .score small{display:inline;margin:0 0 0 6px}
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState } = React;

// --- mock results: shape mirrors search.py {rank, score, record{...}} ---
const MODE_DESC = {
  auto: "向量检索，embed 失败时自动降级到关键词",
  vector: "纯向量检索（FAISS 余弦相似度，0–1）",
  keyword: "关键词命中计数，无需 embedding 模型",
};
const MOCK = [
  { rank:1, score:0.8421, record:{ title:"Scaling Agentic Reasoning with Tool-Use Curricula",
    file_name:"scaling_agentic_2509.12345.pdf", file_type:"pdf", date:"2026-05-30",
    section_title:"Method", chunk_index:3, chunk_total:18,
    source_path:"2026-05-30/HuggingFace/Scaling Agentic_2509.12345.pdf" } },
  { rank:2, score:0.7993, record:{ title:"awesome-llm-agents", file_name:"README.md", file_type:"md",
    date:"2026-05-30", section_title:"Frameworks", chunk_index:0, chunk_total:6,
    source_path:"2026-05-30/GitHub/awesome-llm-agents/README.md" } },
  { rank:3, score:0.7610, record:{ title:"Retrieval-Augmented Planning for Long-Horizon Tasks",
    file_name:"rag_planning_2510.00921.pdf", file_type:"pdf", date:"2026-05-29",
    section_title:"Experiments", chunk_index:7, chunk_total:22,
    source_path:"2026-05-29/HuggingFace/RAG Planning_2510.00921.pdf" } },
  { rank:4, score:0.7188, record:{ title:"vllm-router", file_name:"README_zh.md", file_type:"md",
    date:"2026-05-29", section_title:"快速开始", chunk_index:1, chunk_total:4,
    source_path:"2026-05-29/GitHub/vllm-router/README_zh.md" } },
];

function sourceOf(p){ return /\/GitHub\//.test(p) ? "GitHub" : /\/HuggingFace\//.test(p) ? "HuggingFace" : "—"; }

// derive what a card can open from its source_path:
// HuggingFace 论文_id.pdf  ↔  论文_id_summary.md (摘要译文)
// GitHub      README.md    ↔  README_zh.md (中文翻译)
function openTargets(p){
  const src = sourceOf(p);
  if(src==="HuggingFace"){
    if(/_summary\.md$/i.test(p)) return [{label:"摘要·译文",path:p},{label:"原文 PDF",path:p.replace(/_summary\.md$/i,".pdf")}];
    if(/\.pdf$/i.test(p))        return [{label:"原文 PDF",path:p},{label:"摘要·译文",path:p.replace(/\.pdf$/i,"_summary.md")}];
  }
  if(src==="GitHub"){
    if(/README_zh\.md$/i.test(p)) return [{label:"中文 README",path:p},{label:"原文 README",path:p.replace(/README_zh\.md$/i,"README.md")}];
    if(/README\.md$/i.test(p))    return [{label:"README",path:p},{label:"中文翻译",path:p.replace(/README\.md$/i,"README_zh.md")}];
  }
  return [{label:"打开",path:p}];
}
const openPath = (p) => window.open("/open?path=" + encodeURIComponent(p), "_blank");

function Card({ item, mode }){
  const r = item.record;
  const targets = openTargets(r.source_path);
  const scoreLabel = mode === "keyword" ? "hits" : "cosine";
  const scoreText = mode === "keyword" ? String(Math.round(item.score)) : item.score.toFixed(3);
  return (
    <div className="card" onClick={()=>openPath(targets[0].path)} title={"打开 " + targets[0].label}>
      <div className="rank mono">#{item.rank}</div>
      <div className="cmain">
        <h3 className="ctitle">{r.title || r.file_name}</h3>
        <div className="meta">
          <span><i>date</i><b className="mono">{r.date}</b></span>
          <span><i>type</i><b className="mono">{r.file_type}</b></span>
          <span><i>section</i>{r.section_title}</span>
          <span><i>chunk</i><b className="mono">{r.chunk_index}/{r.chunk_total}</b></span>
          <span className="pill">{sourceOf(r.source_path)}</span>
        </div>
        <div className="snip">
          <span className="label" style={{display:"block",marginBottom:6}}>snippet · clean_snippet(text)</span>
          <div className="bars">
            <div className="bar" style={{width:"96%"}}></div>
            <div className="bar" style={{width:"88%"}}></div>
            <div className="bar" style={{width:"61%"}}></div>
          </div>
        </div>
        <div className="path">{r.source_path}</div>
      </div>
      <div className="cside">
        <div className="score">{scoreText}<small>{scoreLabel}</small></div>
        <div className="opens">
          {targets.map((t,i)=>(
            <button key={t.path} className={"open"+(i?" alt":"")}
              onClick={(e)=>{e.stopPropagation();openPath(t.path);}}>{t.label} ↗</button>
          ))}
        </div>
      </div>
    </div>
  );
}

function App(){
  const [draft, setDraft] = useState("");
  const [keywords, setKeywords] = useState(["llm","agent"]);
  const [mode, setMode] = useState("auto");
  const [topK, setTopK] = useState(10);
  const [results, setResults] = useState(null); // null = not searched yet
  const [loading, setLoading] = useState(false);

  const addKw = () => {
    const parts = draft.split(",").map(s=>s.trim()).filter(Boolean);
    if(!parts.length) return;
    setKeywords([...new Set([...keywords, ...parts])]);
    setDraft("");
  };
  const removeKw = (k) => setKeywords(keywords.filter(x=>x!==k));
  const run = () => {                       // mock; real: GET /search?q=&mode=&top=
    setLoading(true);
    setTimeout(()=>{
      const ql = keywords.map(k=>k.toLowerCase());
      const hit = MOCK.filter(it=>{
        const hay = (it.record.title+" "+it.record.file_name+" "+it.record.section_title).toLowerCase();
        return ql.some(k=>hay.includes(k));
      });
      const out = (hit.length?hit:MOCK).slice(0,topK).map((it,i)=>({...it,rank:i+1}));
      setResults(out);
      setLoading(false);
    },300);
  };

  return (
    <div>
      <header className="topbar">
        <div className="brand">
          <div className="glyph"></div>
          <b>KB Search</b>
          <span className="label">trending_fetcher</span>
        </div>
        <div className="kbstat">
          <div><span className="label">model</span><span className="v">[embed-model]</span></div>
          <div><span className="label">dim</span><span className="v">[d]</span></div>
          <div><span className="label">vectors</span><span className="v">[n]</span></div>
        </div>
        <span className="wftag">WIREFRAME</span>
      </header>

      <div className="layout">
        {/* ---------- LEFT: query builder ---------- */}
        <aside className="panel">
          <h2><span className="n">01</span> 查询构造器</h2>

          <div className="field">
            <span className="label">关键词（逗号可一次加多个）</span>
            <div className="kwrow">
              <input value={draft} placeholder="例如 llm, retrieval"
                onChange={e=>setDraft(e.target.value)}
                onKeyDown={e=>{if(e.key==="Enter")addKw();}} />
              <button className="addbtn" onClick={addKw} aria-label="添加">+</button>
            </div>
            <div className="chips">
              {keywords.length===0 && <span className="empty">尚无关键词</span>}
              {keywords.map(k=>(
                <span className="chip" key={k}>{k}
                  <button className="x" onClick={()=>removeKw(k)} aria-label={"删除 "+k}>×</button>
                </span>
              ))}
            </div>
            <div className="hint">→ search.py 的逗号分隔输入，内部以空格拼接送 embedding</div>
          </div>

          <div className="field">
            <span className="label">检索模式 · --mode</span>
            <div className="modes">
              {["auto","vector","keyword"].map(m=>(
                <button key={m} className={mode===m?"on":""} onClick={()=>setMode(m)}>{m}</button>
              ))}
            </div>
            <div className="modedesc">{MODE_DESC[mode]}</div>
          </div>

          <div className="field">
            <span className="label">返回数量 · --top</span>
            <div className="stepper">
              <button onClick={()=>setTopK(Math.max(1,topK-1))} aria-label="减少">−</button>
              <span className="num">{topK}</span>
              <button onClick={()=>setTopK(Math.min(50,topK+1))} aria-label="增加">+</button>
            </div>
          </div>

          <button className="runbtn" disabled={keywords.length===0||loading} onClick={run}>{loading?"检索中…":"检索"}</button>

          <div className="maps">
            等价命令：<br/>
            <code>python search.py {keywords.join(",")||"<keywords>"} --mode {mode} --top {topK}</code>
          </div>
        </aside>

        {/* ---------- RIGHT: results ---------- */}
        <main className="results">
          {loading ? (
            <div className="loading">检索中… → GET /search?q={keywords.join(",")}&mode={mode}&top={topK}</div>
          ) : results===null ? (
            <div className="empty-state">
              <div className="big">还没有检索结果</div>
              <div>在左侧添加关键词后点「检索」。结果逐篇列出，每篇可分别打开<b>原文 PDF</b>或<b>摘要·译文 MD</b>（GitHub 则为 README / 中文翻译），新标签页打开。</div>
            </div>
          ) : results.length===0 ? (
            <div className="empty-state"><div className="big">无匹配结果</div></div>
          ) : (
            <div>
              <div className="rhead">
                <span className="count">{results.length} 条结果</span>
                <span className="sub mono">{keywords.join(", ")} · {mode}</span>
                <span className="rsort">按后端 rank 排序（{mode==="keyword"?"命中数":"相似度"} 降序）</span>
              </div>
              {results.map(it=> <Card key={it.rank} item={it} mode={mode} />)}
            </div>
          )}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
